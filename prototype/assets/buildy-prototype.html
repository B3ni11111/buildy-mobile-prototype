<title>Buildy Street Scene</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Header, the rotating flat street scene, then a small test-controls panel. Single green look by choice. */
:root {
  --green-1: #5C8064; --green-2: #3A5A40; --green-3: #2A4030;
  --white-1: #FFFFFF; --white-2: #F1F0EC; --white-3: #DEDCD5;
  --gray-1: #4B4E4B;  --gray-2: #343634;  --gray-3: #232523;
  --font: 'Inter', 'Heebo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--green-1);
  color: var(--white-1);
  font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(120px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.greet { font-size: 15px; font-weight: 500; color: var(--white-1); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--white-1); color: var(--gray-2);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 0 var(--green-3);
}
.icon-btn:focus-visible, .panel button:focus-visible { outline: 2px solid var(--green-2); outline-offset: 2px; }
h1 { margin: 0; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.scene { position: relative; width: 100%; aspect-ratio: 1 / 1.1; max-width: 100%; }
.scene canvas { display: block; width: 100% !important; height: 100% !important; }
.panel {
  margin-top: 8px; background: var(--white-1); color: var(--gray-3);
  border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 3px 0 var(--green-3);
}
.panel-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gray-1); }
.ctl { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ctl > span { font-size: 15px; font-weight: 500; }
.seg { display: flex; gap: 4px; background: var(--white-2); padding: 3px; border-radius: 12px; }
.seg button, .step button {
  min-width: 44px; height: 38px; border: 0; border-radius: 9px; cursor: pointer;
  background: transparent; color: var(--gray-2); font: 600 14px var(--font);
}
.seg button[aria-pressed="true"] { background: var(--white-1); color: var(--gray-3); box-shadow: 0 1px 0 var(--white-3); }
.step { display: flex; align-items: center; gap: 4px; background: var(--white-2); padding: 3px; border-radius: 12px; }
.step output { min-width: 28px; text-align: center; font: 700 16px var(--font); font-variant-numeric: tabular-nums; }
.play { height: 44px; padding: 0 18px; border: 0; border-radius: 12px; cursor: pointer; background: var(--gray-3); color: var(--white-1); font: 600 15px var(--font); }
.note { margin: 0; flex: 1 1 180px; min-width: 0; font-size: 13px; line-height: 18px; color: var(--gray-1); }

/* Home cards: white, big round corners, a flat green "lip" instead of a soft shadow */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 4px; }
.card {
  background: var(--white-1); color: var(--gray-3); border-radius: 24px; padding: 16px 18px;
  box-shadow: 0 3px 0 var(--green-3); border: 0; text-align: left; font: inherit; min-width: 0;
  display: flex; flex-direction: column; gap: 6px;
}
button.card { cursor: pointer; }
.card:focus-visible { outline: 2px solid var(--white-1); outline-offset: 3px; }
.card.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.card-label { font-size: 13px; font-weight: 500; color: var(--gray-1); }
.money-num { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.money-num b { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.money-num span { font-size: 17px; font-weight: 500; color: var(--gray-1); font-variant-numeric: tabular-nums; }
.card-sub { font-size: 13px; color: var(--gray-1); }
.ring { position: relative; width: 76px; height: 76px; flex-shrink: 0; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mini-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mini-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--white-2); color: var(--gray-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.big { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.code { letter-spacing: 0.12em; }

/* Door code timer: the ring drains over the 3 seconds the code stays visible */
@keyframes drain { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 100.53; } }
#timerArc.run { animation: drain 3s linear forwards; }

/* Money tab */
.months { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-top: 12px; }
.months::-webkit-scrollbar { display: none; }
.month-page { flex: 0 0 100%; scroll-snap-align: center; padding: 0 1px 4px; min-width: 0; }
.ring-card { align-items: center; text-align: center; padding: 18px 18px 20px; gap: 10px; }
.big-ring { position: relative; width: 200px; height: 200px; max-width: 100%; }
.big-ring svg { display: block; max-width: 100%; height: auto; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ring-center b { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.ring-center span { font-size: 15px; font-weight: 500; color: var(--gray-1); font-variant-numeric: tabular-nums; }
.dots { display: flex; justify-content: center; gap: 2px; margin: 6px 0 0; }
.dot-btn { width: 28px; height: 28px; border: 0; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.dot-btn span { width: 7px; height: 7px; border-radius: 50%; background: var(--green-2); }
.dot-btn[aria-current="true"] span { background: var(--white-1); }
.actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.act { border: 0; background: transparent; color: var(--white-1); font: 500 12px var(--font); display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; padding: 0; text-align: center; }
.act-ic { width: 54px; height: 54px; border-radius: 50%; background: var(--white-1); color: var(--gray-2); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 var(--green-3); }
.pay-btn { width: 100%; height: 56px; border: 0; border-radius: 999px; background: var(--gray-3); color: var(--white-1); font: 600 17px var(--font); cursor: pointer; margin-top: 14px; }
.pay-btn:disabled { opacity: 0.45; cursor: default; }
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 22px 2px 10px; }
.list-title { font-size: 17px; font-weight: 600; }
.seg.light { background: rgba(255, 255, 255, 0.18); }
.seg.light button { color: var(--white-1); }
.seg.light button[aria-pressed="true"] { background: var(--white-1); color: var(--gray-3); box-shadow: none; }
.group { background: var(--white-1); color: var(--gray-3); border-radius: 20px; box-shadow: 0 3px 0 var(--green-3); overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; border: 0; border-top: 1px solid var(--white-2); background: transparent; color: inherit; font: inherit; text-align: left; }
.group > .row:first-child { border-top: 0; }
button.row { cursor: pointer; }
button.row:active { background: var(--white-2); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: 13px; color: var(--gray-1); }
.row-amt { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.st { flex-shrink: 0; }
.st.paid { width: 24px; height: 24px; border-radius: 50%; background: var(--green-2); display: flex; align-items: center; justify-content: center; }
.st.unpaid { font-size: 13px; font-weight: 500; color: var(--gray-1); }
.row.empty { color: var(--gray-1); justify-content: center; }

/* Calculator sheet: slides up from the bottom */
.backdrop { position: fixed; inset: 0; background: rgba(35, 37, 35, 0.45); opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0s linear 0.3s; z-index: 20; }
.backdrop.open { opacity: 1; visibility: visible; transition: opacity 0.3s ease; }
.sheet {
  position: fixed; left: 50%; bottom: 0; width: min(420px, 100%);
  transform: translate(-50%, 105%); visibility: hidden;
  transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.38s; z-index: 21;
  background: var(--green-2); color: var(--white-1); border-radius: 28px 28px 0 0;
  padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.sheet.open { transform: translate(-50%, 0); visibility: visible; transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1); }
.sheet:focus { outline: none; }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.35); margin-bottom: 6px; }
.sheet .card-label { color: var(--white-3); }
.calc-amount { font-size: 56px; line-height: 64px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.calc-result { font-size: 15px; font-weight: 500; color: var(--white-2); min-height: 22px; text-align: center; }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; margin-top: 4px; }
.key { height: 56px; border: 0; background: transparent; color: var(--white-1); font: 600 26px var(--font); border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.key:active { background: rgba(255, 255, 255, 0.12); }
.pills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 4px; }
.pill { height: 48px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.14); color: var(--white-1); font: 600 15px var(--font); cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--white-1); color: var(--gray-3); }
.sheet .pay-btn { margin-top: 6px; }
.key:focus-visible, .pill:focus-visible, .pay-btn:focus-visible, .act:focus-visible, .dot-btn:focus-visible { outline: 2px solid var(--white-1); outline-offset: 2px; }
.row:focus-visible { outline: 2px solid var(--green-2); outline-offset: -2px; }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet.open, .backdrop, .backdrop.open { transition: none; } }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 10px); background: var(--gray-3); color: var(--white-1); padding: 10px 16px; border-radius: 999px; font: 500 14px var(--font); opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Floating tab bar */
.tabbar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(388px, calc(100% - 32px));
  background: var(--white-1); border-radius: 999px; padding: 6px;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;
  box-shadow: 0 3px 0 var(--green-3); z-index: 5;
}
.tab {
  border: 0; background: transparent; border-radius: 999px; cursor: pointer; min-height: 54px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--gray-1); font: 500 12px var(--font);
}
.tab[aria-current="page"] { background: var(--white-2); color: var(--gray-3); font-weight: 600; }
.tab:focus-visible { outline: 2px solid var(--green-2); outline-offset: 1px; }
</style>

<div class="app">

  <div class="top">

    <button class="icon-btn" aria-label="Settings">

    </button>
  </div>
  <h1>Herzl 12</h1>

  <div class="scene" id="scene" role="img" aria-label="A white Tel Aviv style corner building with a rounded corner and curved balconies, slowly turning on a square white plate, with tiny people walking past"></div>

  <div class="cards">
    <button class="card wide" id="moneyCard" aria-label="Money this month, open the Money tab">

      </div>
      <span class="big">3</span>
      <span class="card-sub" id="issuesSub">open in the building</span>

    <button class="card" id="doorCard" aria-label="Door code, tap to show">

        <span class="mini-icon" id="doorIcon" style="position: relative">

          <svg id="timerRing" style="display:none; position:absolute; left:0; top:0" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle id="timerArc" cx="18" cy="18" r="16" fill="none" stroke="#3A5A40" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="100.53" stroke-dashoffset="0" transform="rotate(-90 18 18)"></circle></svg>
        </span>
      </div>
      <span class="big code" id="doorCode">••••</span>
      <span class="card-sub" id="doorSub">Tap to show</span>
    </button>
  </div>

  </section>

  <section id="moneyView" class="view" hidden>
    <div class="top"><span class="greet">Herzl 12</span></div>

      <button class="act" data-soon><span class="act-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span>Settings</button>

    <button class="pay-btn" id="payBtn" hidden>Pay</button>

    <div class="list-head">

    <button class="tab">

<script>
(function () {
  // Home cards: committee vs resident view, door code reveal, tab highlight (mock data)
  const C = 194.8;
  const views = {
    head: { inn: '₪6,300', goal: '/ ₪9,600', sub: '16 of 24 apartments paid', pct: 66, issues: 'open in the building' },
    resident: { inn: '₪400', goal: '/ ₪400', sub: 'Your fee is paid. Thank you', pct: 100, issues: 'open, 1 reported by you' }
  };
  const $ = (id) => document.getElementById(id);
  function setView(v) {
    const d = views[v];
    $('moneyIn').textContent = d.inn; $('moneyGoal').textContent = d.goal; $('moneySub').textContent = d.sub;
    $('ringPct').textContent = d.pct + '%';
    $('ringArc').setAttribute('stroke-dashoffset', String(C * (1 - d.pct / 100)));
    $('issuesSub').textContent = d.issues;
    document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  }
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
  // Door code: tap shows it for 3 seconds. The key icon turns into a copy icon inside a draining timer ring.
  // Tapping again inside those 3 seconds copies the code.
  const CODE = '4821';
  // After a copy the copy icon turns into a check; the ring keeps draining to the end, then everything resets.
  const keyIcon = $('keyIcon'), copyIcon = $('copyIcon'), checkIcon = $('checkIcon'), timerRing = $('timerRing'), timerArc = $('timerArc');
  let hideTimer = null, copied = false;
  function setIcon(revealed) {
    keyIcon.style.display = revealed ? 'none' : '';
    copyIcon.style.display = revealed ? '' : 'none';
    checkIcon.style.display = 'none';
    timerRing.style.display = revealed ? '' : 'none';
    timerArc.classList.remove('run');
    if (revealed) { void timerArc.getBoundingClientRect(); timerArc.classList.add('run'); }
  }
  function hideCode() {
    clearTimeout(hideTimer); hideTimer = null; copied = false;
    $('doorCode').textContent = '••••';
    $('doorSub').textContent = 'Tap to show';
    setIcon(false);
  }
  $('doorCard').addEventListener('click', () => {
    if (hideTimer) {
      if (copied) return;
      const copy = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(CODE) : Promise.reject();
      copy.then(() => {
        copied = true;
        copyIcon.style.display = 'none';
        checkIcon.style.display = '';
        $('doorSub').textContent = 'Code copied';
      }).catch(() => { $('doorSub').textContent = 'Copy not allowed here'; });
      return;
    }
    $('doorCode').textContent = CODE;
    $('doorSub').textContent = 'Tap again to copy';
    setIcon(true);
    hideTimer = setTimeout(hideCode, 3000);
  });
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((x) => x.removeAttribute('aria-current'));
    t.setAttribute('aria-current', 'page');
  }));
})();
</script>

<script>
(function () {
  // Money tab (mock data, demo payments only)
  const $ = (id) => document.getElementById(id);
  const NAMES = ['Yossi Cohen', 'Maya Friedman', 'Omer Shapiro', 'Noa Ben David', 'Avi Mizrahi', 'Tamar Katz', 'Dana Levi', 'Eitan Golan',
    'Noa Peretz', 'Ronit Avraham', 'Itai Bar', 'Shira Klein', 'Gil Amar', 'Lior Dahan', 'Yael Segal', 'Moshe Azulay',
    'Hila Rosen', 'Amit Levy', 'Rina Biton', 'Uri Hadad', 'Michal Oren', 'Ben Sasson', 'Talia Ezra', 'Ido Navon'];
  const SIZES = [72, 85, 96, 110, 72, 85, 96, 110, 72, 85, 96, 110, 78, 90, 100, 118, 78, 90, 100, 118, 80, 92, 104, 120];
  const ME = 8; // the resident in "View as: Resident" lives in apartment 9
  const N = NAMES.length;
  const baseFees = NAMES.map(() => 400);
  const month = (label, short, paidIf) => ({ label, short, fees: baseFees.slice(), paid: new Set(NAMES.map((_, i) => i).filter(paidIf)) });
  const months = [
    month('September 2026', 'September', () => true),
    month('October 2026', 'October', (i) => i !== 5),
    month('November 2026', 'November', (i) => i % 3 !== 2)
  ];
  const CUR = months.length - 1;
  let view = 'head', page = CUR, filter = 'all';
  const fmt = (n) => '₪' + Math.round(n).toLocaleString('en-US');
  const total = (m, paidOnly) => m.fees.reduce((a, f, i) => a + (paidOnly && !m.paid.has(i) ? 0 : f), 0);
  const RC = 2 * Math.PI * 84;
  const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';

  function stats(m) {
    if (view === 'resident') {
      const fee = m.fees[ME], p = m.paid.has(ME);
      return { inn: p ? fee : 0, goal: fee, pct: p ? 100 : 0, sub: p ? 'Your fee is paid' : 'Not paid yet' };
    }
    const g = total(m), c = total(m, true);
    return { inn: c, goal: g, pct: g ? Math.round(c / g * 100) : 0, sub: m.paid.size + ' of ' + N + ' apartments paid' };
  }

  function renderMonths() {
    const box = $('months');
    box.innerHTML = months.map((m, i) => {
      const s = stats(m), off = RC * (1 - s.pct / 100);
      return '<div class="month-page"><div class="card ring-card">' +
        '<span class="card-label">' + m.label + (i === CUR ? ' · this month' : '') + '</span>' +
        '<div class="big-ring"><svg width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">' +
        '<circle cx="100" cy="100" r="84" fill="none" stroke="#DEDCD5" stroke-width="16"></circle>' +
        '<circle cx="100" cy="100" r="84" fill="none" stroke="#3A5A40" stroke-width="16" stroke-linecap="round" stroke-dasharray="' + RC + '" stroke-dashoffset="' + off + '" transform="rotate(-90 100 100)"></circle>' +
        '</svg><div class="ring-center"><b>' + fmt(s.inn) + '</b><span>of ' + fmt(s.goal) + '</span></div></div>' +
        '<span class="card-sub">' + s.sub + '</span></div></div>';
    }).join('');
    box.scrollLeft = page * box.clientWidth;
    renderDots();
  }
  function renderDots() {
    $('monthDots').innerHTML = months.map((m, i) =>
      '<button class="dot-btn" data-p="' + i + '" aria-label="' + m.label + '"' + (i === page ? ' aria-current="true"' : '') + '><span></span></button>').join('');
  }
  function row(title, fee, paid, idx) {
    const btn = idx !== undefined;
    const tag = btn ? 'button' : 'div';
    return '<' + tag + ' class="row"' + (btn ? ' data-i="' + idx + '" aria-label="' + title + ', ' + (paid ? 'paid, tap to undo' : 'unpaid, tap to mark paid') + '"' : '') + '>' +
      '<span class="row-main"><span class="row-title">' + title + '</span></span>' +
      '<span class="row-amt">' + fmt(fee) + '</span>' +
      (paid ? '<span class="st paid" aria-label="Paid">' + CHECK + '</span>' : '<span class="st unpaid">Unpaid</span>') +
      '</' + tag + '>';
  }
  function renderList() {
    const m = months[page];
    if (view === 'resident') {
      $('listTitle').textContent = 'Your payments · Apartment ' + (ME + 1);
      $('filters').hidden = true;
      $('aptList').innerHTML = months.slice().reverse().map((mm) => row(mm.label, mm.fees[ME], mm.paid.has(ME))).join('');
      return;
    }
    $('filters').hidden = false;
    $('listTitle').textContent = 'Apartments · ' + m.short;
    const editable = page === CUR;
    const rows = NAMES.map((n, i) => ({ n, i, p: m.paid.has(i) }))
      .filter((r) => filter === 'all' || (filter === 'paid' ? r.p : !r.p))
      .map((r) => row('Apt ' + (r.i + 1) + ' · ' + r.n, m.fees[r.i], r.p, editable ? r.i : undefined));
    $('aptList').innerHTML = rows.join('') || '<div class="row empty">No apartments here</div>';
  }
  function renderControls() {
    const head = view === 'head';
    $('headActions').hidden = !head;
    const m = months[CUR];
    const showPay = !head && !m.paid.has(ME);
    $('payBtn').hidden = !showPay;
    $('payBtn').textContent = 'Pay ' + fmt(m.fees[ME]) + ' · demo';
  }
  function updateHome() {
    const m = months[CUR], s = stats(m);
    $('moneyMonth').textContent = m.short;
    $('moneyIn').textContent = fmt(s.inn);
    $('moneyGoal').textContent = '/ ' + fmt(s.goal);
    $('moneySub').textContent = s.sub;
    $('ringPct').textContent = s.pct + '%';
    $('ringArc').setAttribute('stroke-dashoffset', String(194.8 * (1 - s.pct / 100)));
  }
  function renderAll() { renderMonths(); renderList(); renderControls(); updateHome(); }

  let tt;
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); }

  // Swipe between months
  let st;
  $('months').addEventListener('scroll', () => {
    clearTimeout(st);
    st = setTimeout(() => {
      const b = $('months');
      const p = Math.max(0, Math.min(months.length - 1, Math.round(b.scrollLeft / b.clientWidth)));
      if (p !== page) { page = p; renderDots(); renderList(); }
    }, 80);
  });
  $('monthDots').addEventListener('click', (e) => {
    const d = e.target.closest('[data-p]'); if (!d) return;
    page = Number(d.dataset.p);
    $('months').scrollTo({ left: page * $('months').clientWidth, behavior: 'smooth' });
    renderDots(); renderList();
  });

  // Head: tap a row in the current month to mark it paid (or undo), mark all
  $('aptList').addEventListener('click', (e) => {
    const r = e.target.closest('[data-i]'); if (!r) return;
    const i = Number(r.dataset.i), set = months[CUR].paid;
    if (set.has(i)) set.delete(i); else set.add(i);
    renderAll();
  });
  $('actMarkAll').addEventListener('click', () => {
    NAMES.forEach((_, i) => months[CUR].paid.add(i));
    page = CUR; renderAll();
    toast('All ' + N + ' apartments marked paid for ' + months[CUR].short);
  });
  document.querySelectorAll('[data-soon]').forEach((b) => b.addEventListener('click', () => toast('Not in this prototype yet')));
  $('filters').addEventListener('click', (e) => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('#filters [data-f]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderList();
  });

  // Resident: demo Pay
  $('payBtn').addEventListener('click', () => {
    months[CUR].paid.add(ME);
    renderAll();
    toast('Paid ' + fmt(months[CUR].fees[ME]) + '. Demo only, no real money');
  });

  // View as (runs after the Home card script, so live numbers win)
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { view = b.dataset.view; renderAll(); }));

  // Calculator: the special numpad, sliding up from the bottom
  let digits = '0', split = 'equal', lastFocus = null;
  const amount = () => parseFloat(digits) || 0;
  function perApartment(b) {
    if (split === 'equal') return NAMES.map(() => b / N);
    const tot = SIZES.reduce((a, s) => a + s, 0);
    return SIZES.map((s) => b * s / tot);
  }
  function renderCalc() {
    const [whole, dec] = digits.split('.');
    $('calcAmount').textContent = '₪' + Number(whole).toLocaleString('en-US') + (dec !== undefined ? '.' + dec : '');
    const b = amount();
    let msg = "Type the building's monthly budget";
    if (b) {
      const per = perApartment(b);
      msg = split === 'equal' ? fmt(per[0]) + ' per apartment' : fmt(Math.min.apply(null, per)) + ' to ' + fmt(Math.max.apply(null, per)) + ' per apartment, by size';
    }
    $('calcResult').textContent = msg;
    $('calcApply').disabled = !b;
    $('calcApply').textContent = 'Apply to ' + months[CUR].short;
  }
  function openCalc() {
    lastFocus = document.activeElement;
    digits = '0'; renderCalc();
    $('sheetBackdrop').classList.add('open');
    $('calcSheet').classList.add('open');
    setTimeout(() => $('calcSheet').focus(), 50);
  }
  function closeCalc() {
    $('sheetBackdrop').classList.remove('open');
    $('calcSheet').classList.remove('open');
    if (lastFocus) lastFocus.focus();
  }
  $('actCalc').addEventListener('click', openCalc);
  $('sheetBackdrop').addEventListener('click', closeCalc);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('calcSheet').classList.contains('open')) closeCalc(); });
  $('keypad').addEventListener('click', (e) => {
    const k = e.target.closest('[data-k]'); if (!k) return;
    const key = k.dataset.k;
    if (key === 'back') digits = digits.length > 1 ? digits.slice(0, -1) : '0';
    else if (key === '.') { if (!digits.includes('.')) digits += '.'; }
    else {
      if (digits.includes('.') && digits.split('.')[1].length >= 2) return;
      if (digits.replace('.', '').length >= 7) return;
      digits = digits === '0' ? key : digits + key;
    }
    renderCalc();
  });
  document.querySelectorAll('[data-split]').forEach((b) => b.addEventListener('click', () => {
    split = b.dataset.split;
    document.querySelectorAll('[data-split]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderCalc();
  }));
  $('calcApply').addEventListener('click', () => {
    const b = amount(); if (!b) return;
    months[CUR].fees = perApartment(b).map((v) => Math.round(v));
    closeCalc(); page = CUR; renderAll();
    toast(months[CUR].short + ' fees updated. Past months keep theirs');
  });

  // Tabs: Home and Money switch views; Issues and People are not designed yet
  const TABS = ['home', 'money', 'issues', 'people'];
  let current = 'home';
  const tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  function show(name) {
    current = name;
    $('homeView').hidden = name !== 'home';
    $('moneyView').hidden = name !== 'money';
    document.querySelectorAll('.home-only').forEach((el) => { el.hidden = name !== 'home'; });
    tabs.forEach((t, i) => { if (TABS[i] === name) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
    window.scrollTo(0, 0);
    if (name === 'money') requestAnimationFrame(renderAll);
  }
  tabs.forEach((t, i) => t.addEventListener('click', () => {
    const name = TABS[i];
    if (name === 'home' || name === 'money') show(name);
    else { show(current); toast(name === 'issues' ? 'Issues tab comes next' : 'People tab comes later'); }
  }));
  $('moneyCard').addEventListener('click', () => show('money'));

  renderAll();
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const PAL = {
    green: [0x5C8064, 0x3A5A40, 0x2A4030],
    white: [0xFFFFFF, 0xF1F0EC, 0xDEDCD5],
    gray:  [0x4B4E4B, 0x343634, 0x232523]
  };
  // The light turns with the scene, so each side keeps its own fixed shade while it rotates.
  // Light comes from the L's inner corner side, so shade and shadows fall diagonally toward the rounded outer corner.
  const LIGHT_BASE = new THREE.Vector3(-0.6, 1, -0.6).normalize();
  const LIGHT = LIGHT_BASE.clone();
  const Y_AXIS = new THREE.Vector3(0, 1, 0);

  // Flat 3-shade shading: each surface takes exactly one palette shade by how it faces a fixed light.
  const VS = [
    'varying vec3 vN;',
    'void main(){',
    '  vec4 p = vec4(position, 1.0);',
    '  vec3 n = normal;',
    '#ifdef USE_INSTANCING',
    '  p = instanceMatrix * p;',
    '  n = mat3(instanceMatrix) * n;',
    '#endif',
    '  vN = normalize(mat3(modelMatrix) * n);',
    '  gl_Position = projectionMatrix * viewMatrix * modelMatrix * p;',
    '}'
  ].join('\n');
  const FS_WALL = 'uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 L; varying vec3 vN; void main(){ float d = dot(normalize(vN), L); gl_FragColor = vec4(d > 0.62 ? c0 : (d > 0.04 ? c1 : c2), 1.0); }';
  // Window glass: always one shade lighter than the wall it sits in, so it reads on both lit and shaded walls.
  const FS_GLASS = 'uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 L; varying vec3 vN; void main(){ float d = dot(normalize(vN), L); gl_FragColor = vec4(d > 0.04 ? c0 : c1, 1.0); }';
  function shaded(name, fs) {
    const p = PAL[name];
    return new THREE.ShaderMaterial({
      uniforms: { c0: { value: new THREE.Color(p[0]) }, c1: { value: new THREE.Color(p[1]) }, c2: { value: new THREE.Color(p[2]) }, L: { value: LIGHT } },
      vertexShader: VS, fragmentShader: fs || FS_WALL
    });
  }
  // Leaves use only the two lighter greens, so round plants never get a dark rim that looks like an outline.
  const FS_LEAF = 'uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 L; varying vec3 vN; void main(){ float d = dot(normalize(vN), L); gl_FragColor = vec4(d > 0.5 ? c0 : c1, 1.0); }';
  const M = { leaf: shaded('green', FS_LEAF), green: shaded('green'), white: shaded('white'), gray: shaded('gray'), glass: shaded('white', FS_GLASS) };
  const litMat = new THREE.MeshBasicMaterial({ color: PAL.green[0] });
  const roofInset = new THREE.MeshBasicMaterial({ color: PAL.white[1] });
  const shadowMat = new THREE.MeshBasicMaterial({ color: PAL.gray[2], transparent: true, opacity: 0.12, depthWrite: false });
  const plateShadowMat = new THREE.MeshBasicMaterial({ color: PAL.green[2], transparent: true, opacity: 0.45, depthWrite: false });
  // Soft halo around a lit window: even in the middle, fading only at the edges (no bright dot).
  const glowTex = (function () {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(92,128,100,0.03)';
    for (let k = 0; k < 14; k++) {
      const i = 4 + k * 2.6, r = Math.max(2, 24 - k * 1.4);
      const x = i, y = i * 0.75, w = 256 - 2 * i, h = 128 - 2 * i * 0.75;
      g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
      g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
      g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath(); g.fill();
    }
    const t = new THREE.CanvasTexture(c); t.minFilter = THREE.LinearFilter; return t;
  })();
  const glowMat = new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false });
  // Even green light over the whole glass of a lit window
  const tintMat = new THREE.MeshBasicMaterial({ color: PAL.green[0], transparent: true, opacity: 0.32, depthWrite: false, side: THREE.DoubleSide });

  // Shape helpers. Shapes are drawn in (x, -z) and laid flat, so world z = -shape y.
  function rrShape(w, d, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -d / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
    s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  // The corner building: front arm along the street, right arm going back, big rounded corner at front right.
  const R = 14, CX = 11, CZ = 16;
  function lShape(o) {
    const s = new THREE.Shape();
    s.moveTo(-25 - o, -6 + o);
    s.lineTo(-25 - o, -30 - o);
    s.lineTo(CX, -30 - o);
    s.absarc(CX, -CZ, R + o, -Math.PI / 2, 0, false);
    s.lineTo(25 + o, 30 + o);
    s.lineTo(1 - o, 30 + o);
    s.lineTo(1 - o, -6 + o);
    s.closePath();
    return s;
  }
  function sector(r0, r1) {
    const s = new THREE.Shape();
    s.absarc(CX, -CZ, r1, -Math.PI / 2, 0, false);
    s.absarc(CX, -CZ, r0, 0, -Math.PI / 2, true);
    s.closePath();
    return s;
  }
  function extrude(shape, h, mat, y) {
    const g = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 18 });
    g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, mat);
    m.position.y = y;
    return m;
  }
  function flatShape(shape, mat, y) {
    const g = new THREE.ShapeGeometry(shape, 18);
    g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, mat);
    m.position.y = y;

  // Camera: fixed flat (orthographic) view from 30 degrees up. Only the world turns.

  function frame(n) {

    const aspect = w / h;

  syncPlay();
  playBtn.addEventListener('click', () => { paused = !paused; syncPlay(); });
  document.querySelectorAll('[data-sec]').forEach((b) => b.addEventListener('click', () => {
    period = Number(b.dataset.sec);
    document.querySelectorAll('[data-sec]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
  const out = document.getElementById('floorsOut');
  const setFloors = (n) => { floors = Math.max(1, Math.min(8, n)); out.textContent = floors; buildBuilding(floors); };
  document.getElementById('floorsDown').addEventListener('click', () => setFloors(floors - 1));
  document.getElementById('floorsUp').addEventListener('click', () => setFloors(floors + 1));

  if (window.ResizeObserver) new ResizeObserver(() => frame(floors)).observe(host);
  else window.addEventListener('resize', () => frame(floors));

  buildBuilding(floors);
  updateWalkers(0);
  updateClouds(0);
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) {
      world.rotation.y += (Math.PI * 2) * dt / period;
      updateWalkers(dt);
      updateClouds(dt);
    }
    LIGHT.copy(LIGHT_BASE).applyAxisAngle(Y_AXIS, world.rotation.y);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
