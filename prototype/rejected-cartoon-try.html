<title>Buildy Street Scene</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Header, the rotating flat street scene, then a small test-controls panel. Single green look by choice. */
:root {
  --green-1: #5C8064; --green-2: #3A5A40; --green-3: #2A4030;
  --white-1: #FFFFFF; --white-2: #F1F0EC; --white-3: #DEDCD5;
  --gray-1: #4B4E4B;  --gray-2: #343634;  --gray-3: #232523;
  --font: 'Inter', 'Heebo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--green-1);
  color: var(--white-1);
  font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
.app { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.greet { font-size: 15px; font-weight: 500; color: var(--white-1); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--white-1); color: var(--gray-2);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 0 var(--green-3);
}
.icon-btn:focus-visible, .panel button:focus-visible { outline: 2px solid var(--green-2); outline-offset: 2px; }
h1 { margin: 0; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.scene { position: relative; width: 100%; aspect-ratio: 1 / 1.1; max-width: 100%; }
.scene canvas { display: block; width: 100% !important; height: 100% !important; }
.panel {
  margin-top: 8px; background: var(--white-1); color: var(--gray-3);
  border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 3px 0 var(--green-3);
}
.panel-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gray-1); }
.ctl { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ctl > span { font-size: 15px; font-weight: 500; }
.seg { display: flex; gap: 4px; background: var(--white-2); padding: 3px; border-radius: 12px; }
.seg button, .step button {
  min-width: 44px; height: 38px; border: 0; border-radius: 9px; cursor: pointer;
  background: transparent; color: var(--gray-2); font: 600 14px var(--font);
}
.seg button[aria-pressed="true"] { background: var(--white-1); color: var(--gray-3); box-shadow: 0 1px 0 var(--white-3); }
.step { display: flex; align-items: center; gap: 4px; background: var(--white-2); padding: 3px; border-radius: 12px; }
.step output { min-width: 28px; text-align: center; font: 700 16px var(--font); font-variant-numeric: tabular-nums; }
.play { height: 44px; padding: 0 18px; border: 0; border-radius: 12px; cursor: pointer; background: var(--gray-3); color: var(--white-1); font: 600 15px var(--font); }
.note { margin: 0; flex: 1 1 180px; min-width: 0; font-size: 13px; line-height: 18px; color: var(--gray-1); }
</style>

<div class="app">
  <div class="top">
    <span class="greet">Good evening, Dana</span>
    <button class="icon-btn" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.830-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>
  <h1>Herzl 12</h1>

  <div class="scene" id="scene" role="img" aria-label="A white Tel Aviv style corner building with a rounded corner and curved balconies, slowly turning on a square white plate, with tiny people walking past"></div>

  <section class="panel" aria-label="Test controls">
    <span class="panel-label">Test controls</span>
    <div class="ctl">
      <span>Floors above the street</span>
      <div class="step">
        <button id="floorsDown" aria-label="One floor less">−</button>
        <output id="floorsOut">3</output>
        <button id="floorsUp" aria-label="One floor more">+</button>
      </div>
    </div>
    <div class="ctl">
      <span>One turn</span>
      <div class="seg" role="group" aria-label="Turn speed">
        <button data-sec="30" aria-pressed="false">30s</button>
        <button data-sec="60" aria-pressed="true">60s</button>
        <button data-sec="90" aria-pressed="false">90s</button>
      </div>
    </div>
    <div class="ctl">
      <p class="note">Flat colors only. White windows; some glow with soft green light from inside.</p>
      <button class="play" id="play">Pause</button>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const PAL = {
    green: [0x5C8064, 0x3A5A40, 0x2A4030],
    white: [0xFFFFFF, 0xF1F0EC, 0xDEDCD5],
    gray:  [0x4B4E4B, 0x343634, 0x232523]
  };
  // The light turns with the scene, so each side keeps its own fixed shade while it rotates.
  const LIGHT_BASE = new THREE.Vector3(-0.45, 1, 0.55).normalize();
  const LIGHT = LIGHT_BASE.clone();
  const Y_AXIS = new THREE.Vector3(0, 1, 0);

  // Flat 3-shade shading: each surface takes exactly one palette shade by how it faces a fixed light.
  const VS = [
    'varying vec3 vN;',
    'void main(){',
    '  vec4 p = vec4(position, 1.0);',
    '  vec3 n = normal;',
    '#ifdef USE_INSTANCING',
    '  p = instanceMatrix * p;',
    '  n = mat3(instanceMatrix) * n;',
    '#endif',
    '  vN = normalize(mat3(modelMatrix) * n);',
    '  gl_Position = projectionMatrix * viewMatrix * modelMatrix * p;',
    '}'
  ].join('\n');
  const FS_WALL = 'uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 L; varying vec3 vN; void main(){ float d = dot(normalize(vN), L); gl_FragColor = vec4(d > 0.62 ? c0 : (d > 0.04 ? c1 : c2), 1.0); }';
  // Window glass: always one shade lighter than the wall it sits in, so it reads on both lit and shaded walls.
  const FS_GLASS = 'uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 L; varying vec3 vN; void main(){ float d = dot(normalize(vN), L); gl_FragColor = vec4(d > 0.04 ? c0 : c1, 1.0); }';
  function shaded(name, fs) {
    const p = PAL[name];
    return new THREE.ShaderMaterial({
      uniforms: { c0: { value: new THREE.Color(p[0]) }, c1: { value: new THREE.Color(p[1]) }, c2: { value: new THREE.Color(p[2]) }, L: { value: LIGHT } },
      vertexShader: VS, fragmentShader: fs || FS_WALL
    });
  }
  const M = { green: shaded('green'), white: shaded('white'), gray: shaded('gray'), glass: shaded('white', FS_GLASS) };
  const litMat = new THREE.MeshBasicMaterial({ color: PAL.green[0] });
  const roofInset = new THREE.MeshBasicMaterial({ color: PAL.white[1] });
  const shadowMat = new THREE.MeshBasicMaterial({ color: PAL.gray[2], transparent: true, opacity: 0.12, depthWrite: false });
  const plateShadowMat = new THREE.MeshBasicMaterial({ color: PAL.green[2], transparent: true, opacity: 0.45, depthWrite: false });
  // Soft halo around a lit window: even in the middle, fading only at the edges (no bright dot).
  const glowTex = (function () {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(92,128,100,0.03)';
    for (let k = 0; k < 14; k++) {
      const i = 4 + k * 2.6, r = Math.max(2, 24 - k * 1.4);
      const x = i, y = i * 0.75, w = 256 - 2 * i, h = 128 - 2 * i * 0.75;
      g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
      g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
      g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath(); g.fill();
    }
    const t = new THREE.CanvasTexture(c); t.minFilter = THREE.LinearFilter; return t;
  })();
  const glowMat = new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false });
  // Even green light over the whole glass of a lit window
  const tintMat = new THREE.MeshBasicMaterial({ color: PAL.green[0], transparent: true, opacity: 0.32, depthWrite: false, side: THREE.DoubleSide });

  // Shape helpers. Shapes are drawn in (x, -z) and laid flat, so world z = -shape y.
  function rrShape(w, d, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -d / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
    s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  // The corner building: front arm along the street, right arm going back, big rounded corner at front right.
  const R = 14, CX = 11, CZ = 16;
  // Every corner is softly rounded (cartoon look); the big corner keeps its wide curve.
  function lShape(o) {
    const s = new THREE.Shape();
    const rc = Math.max(0.6, 3 + o), rv = Math.max(0.6, 3 - o);
    const A = [-25 - o, -6 + o], B = [-25 - o, -30 - o], C = [CX, -30 - o], E = [25 + o, 30 + o], F = [1 - o, 30 + o], G = [1 - o, -6 + o];
    const toward = (P, Q, r) => { const dx = Q[0] - P[0], dy = Q[1] - P[1], l = Math.hypot(dx, dy); return [P[0] + dx / l * r, P[1] + dy / l * r]; };
    const corner = (P, prev, next, r) => { const p1 = toward(P, prev, r), p2 = toward(P, next, r); s.lineTo(p1[0], p1[1]); s.quadraticCurveTo(P[0], P[1], p2[0], p2[1]); };
    s.moveTo((G[0] + A[0]) / 2, (G[1] + A[1]) / 2);
    corner(A, G, B, rc);
    corner(B, A, C, rc);
    s.lineTo(C[0], C[1]);
    s.absarc(CX, -CZ, R + o, -Math.PI / 2, 0, false);
    corner(E, [25 + o, -CZ], F, rc);
    corner(F, E, G, rc);
    corner(G, F, A, rv);
    s.closePath();
    return s;
  }
  function sector(r0, r1) {
    const s = new THREE.Shape();
    s.absarc(CX, -CZ, r1, -Math.PI / 2, 0, false);
    s.absarc(CX, -CZ, r0, 0, -Math.PI / 2, true);
    s.closePath();
    return s;
  }
  // puffy = soft rounded edges (a bevel), still spanning exactly y..y+h
  function extrude(shape, h, mat, y, puffy) {
    const b = puffy ? Math.min(0.5, h * 0.3) : 0;
    const g = new THREE.ExtrudeGeometry(shape, puffy
      ? { depth: h - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 18 }
      : { depth: h, bevelEnabled: false, curveSegments: 18 });
    g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, mat);
    m.position.y = y + b;
    return m;
  }
  function flatShape(shape, mat, y) {
    const g = new THREE.ShapeGeometry(shape, 18);
    g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, mat);
    m.position.y = y;
    return m;
  }
  function box(w, h, d, mat, x, y, z) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); return m; }

  // Sample an outline every ~1 unit, with tangent, outward normal and "near a sharp corner" flag.
  function inPoly(pts, x, z) {
    let c = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a.y > z) !== (b.y > z) && x < (b.x - a.x) * (z - a.y) / (b.y - a.y) + a.x) c = !c;
    }
    return c;
  }
  function samples(o) {
    const sh = lShape(o);
    const N = Math.round(sh.getLength());
    const pts = sh.getSpacedPoints(N).slice(0, N).map((p) => new THREE.Vector2(p.x, -p.y));
    const out = pts.map((p, i) => {
      const a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N];
      const t = new THREE.Vector2(b.x - a.x, b.y - a.y).normalize();
      let n = new THREE.Vector2(-t.y, t.x);
      if (inPoly(pts, p.x + n.x * 0.6, p.y + n.y * 0.6)) n.negate();
      return { p, t, n, blocked: false };
    });
    for (let i = 0; i < N; i++) {
      const a = pts[(i - 2 + N) % N], b = pts[i], c = pts[(i + 2) % N];
      const d1 = new THREE.Vector2(b.x - a.x, b.y - a.y).normalize(), d2 = new THREE.Vector2(c.x - b.x, c.y - b.y).normalize();
      if (d1.dot(d2) < Math.cos(35 * Math.PI / 180)) for (let k = -3; k <= 3; k++) out[(i + k + N) % N].blocked = true;
    }
    return out;
  }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  // Irregular window runs along an outline, so floors never line up into a grid.
  function windowRuns(S, rand, minW, maxW, minG, maxG, skip) {
    const N = S.length, res = [];
    let s = Math.floor(rand() * 4);
    while (s < N) {
      s += Math.floor(minG + rand() * (maxG - minG));
      const w = Math.floor(minW + rand() * (maxW - minW));
      const run = [];
      for (let k = 0; k <= w && s < N; k++, s++) {
        if (S[s].blocked || (skip && skip(S[s]))) { if (run.length) break; continue; }
        run.push(s);
      }
      if (run.length >= 3) res.push(run);
    }
    return res;
  }

  // Scene, camera, renderer
  const host = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -500, 500);
  const world = new THREE.Group();
  scene.add(world);

  const TOP = 2, PLATE = 88, HALF = PLATE / 2;
  // Square white ground plate
  world.add(extrude(rrShape(PLATE, PLATE, 8), 4, M.white, -2, true));
  const ps = flatShape(rrShape(PLATE, PLATE, 8), plateShadowMat, -2.05);
  ps.position.x = 2.5; ps.position.z = 3.5;
  world.add(ps);

  function roundShadow(r, x, z) {
    const m = flatShape(new THREE.Shape().absarc(0, 0, r, 0, Math.PI * 2, false), shadowMat, TOP + 0.03);
    m.position.x = x + 0.6; m.position.z = z + 0.6; world.add(m);
  }
  function place3(o, x, y, z) { o.position.set(x, y, z); return o; }
  function blob(r, mat, x, y, z, sy, parent) {
    const geo = new THREE.SphereGeometry(r, 14, 10);
    const b = new THREE.Mesh(geo, mat);
    b.scale.set(1, sy || 1, 1); b.position.set(x, y, z);
    (parent || world).add(b);
    if (mat === M.green) outline(b, inkGreen, 1.1);
    return b;
  }
  // Cartoon ink: a slightly bigger back-facing copy drawn behind the shape
  const inkGreen = new THREE.MeshBasicMaterial({ color: PAL.green[2], side: THREE.BackSide });
  const inkCloud = new THREE.MeshBasicMaterial({ color: PAL.white[2], side: THREE.BackSide });
  function outline(mesh, mat, k) {
    const h = new THREE.Mesh(mesh.geometry, mat);
    h.position.copy(mesh.position); h.rotation.copy(mesh.rotation);
    h.scale.copy(mesh.scale).multiplyScalar(k);
    mesh.parent.add(h);
    return h;
  }
  // Tree in the back yard of the L: square tree pit, tapered trunk with two branches, a cluster crown
  const TX = -12, TZ = -16;
  roundShadow(6, TX, TZ);
  [[0, -3.5, 7.4, 0.8], [0, 3.5, 7.4, 0.8], [-3.5, 0, 0.8, 6], [3.5, 0, 0.8, 6]].forEach(([dx, dz, w, d]) => world.add(box(w, 0.6, d, M.white, TX + dx, TOP + 0.3, TZ + dz)));
  world.add(place3(new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.95, 9, 9), M.gray), TX, TOP + 4.5, TZ));
  [[-1, 0.7], [1, -0.6]].forEach(([side, tw]) => {
    const br = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.4, 4, 7), M.gray);
    br.position.set(TX + side * 1.3, TOP + 7.2, TZ + tw);
    br.rotation.z = -side * 0.75;
    world.add(br);
  });
  [[0, 13.2, 0, 4.6], [-3.4, 11.4, 1.2, 3.3], [3.3, 11.8, -0.9, 3.5], [0.7, 16.2, 0.4, 3.1], [-1.5, 12.2, -3, 3.1], [1.8, 11, 3, 2.7]].forEach(([dx, y, dz, r]) => blob(r, M.green, TX + dx, TOP + y, TZ + dz, 1.05));
  // Bush at the front left: a few leafy blobs with tiny white flowers
  const BX = -38, BZ = 24;
  roundShadow(5.2, BX, BZ);
  const bushBlobs = [[0, 2.7, 0, 3.0], [-2.7, 2.0, 1.4, 2.3], [2.5, 2.0, -1.2, 2.4], [-0.6, 1.8, 2.8, 2.0], [1.3, 4.1, 0.5, 1.9], [-1.8, 3.4, -1.6, 1.8]];
  bushBlobs.forEach(([dx, y, dz, r]) => blob(r, M.green, BX + dx, TOP + y, BZ + dz, 0.9));
  const fr = rng(31);
  for (let i = 0; i < 11; i++) {
    const [dx, y, dz, r] = bushBlobs[i % bushBlobs.length];
    const a = fr() * Math.PI * 2, up = 0.35 + fr() * 0.55;
    const k = Math.sqrt(1 - up * up);
    blob(0.42, M.white, BX + dx + Math.cos(a) * k * r, TOP + y + up * r * 0.9, BZ + dz + Math.sin(a) * k * r);
  }
  // Streetlight at the front, by the rounded corner
  // Streetlight at the front left by the bush, its lamp reaching in toward the front of the building
  const LX = -39, LZ = 33.5;
  roundShadow(1.1, LX, LZ);
  world.add(box(1.2, 20, 1.2, M.gray, LX, TOP + 10, LZ));
  world.add(box(6, 1, 1, M.gray, LX + 2.6, TOP + 19.5, LZ));
  world.add(box(3, 1.3, 3, M.white, LX + 5, TOP + 18.4, LZ));
  // Bench against the back wall of the building, facing out to the back sidewalk
  const BNX = 13, BNZ = -33.2;
  const bsh = flatShape(rrShape(9, 4, 0.8), shadowMat, TOP + 0.03);
  bsh.position.x = BNX + 0.6; bsh.position.z = BNZ + 0.4; world.add(bsh);
  world.add(box(8, 0.5, 2.6, M.white, BNX, TOP + 2.1, BNZ));
  world.add(box(8, 2.4, 0.5, M.white, BNX, TOP + 3.6, BNZ + 1.3));
  [[-3.4, 1.1], [3.4, 1.1], [-3.4, -1.1], [3.4, -1.1]].forEach(([dx, dz]) => world.add(box(0.5, 1.9, 0.5, M.gray, BNX + dx, TOP + 0.95, BNZ + dz)));

  // The building
  const G = 11;            // ground floor height
  const FLOOR = 10;
  let building = null, runs = [], paneUnlit = null, paneLit = null, tintMesh = null;
  // A small white pot with a leafy plant; the seed picks one of three plant shapes.
  let potPick = Math.random;
  function pot(x, y, z, seed) {
    if (potPick() > 0.4) return; // only some balcony spots get a plant
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.62, 1.4, 12), M.white);
    p.position.set(x, y + 0.7, z);
    building.add(p);
    const kind = Math.abs(Math.round(seed)) % 3;
    const leaf = (r, dx, dy, dz, sy) => blob(r, M.green, x + dx, y + 1.4 + dy, z + dz, sy, building);
    if (kind === 0) { leaf(1.15, 0, 0.9, 0); leaf(0.7, 0.6, 1.7, 0.2); }
    else if (kind === 1) { leaf(0.75, 0, 0.8, 0, 1.2); leaf(0.6, 0, 1.9, 0, 1.3); leaf(0.42, 0, 2.8, 0, 1.3); }
    else { leaf(0.75, -0.6, 0.6, 0); leaf(0.75, 0.6, 0.6, 0.2); leaf(0.65, 0, 1.2, -0.4); }
  }
  const DOOR = { x: -12, z: 27 };
  const nearDoor = (s) => Math.abs(s.p.x - DOOR.x) < 4.5 && s.p.y > 20;

  function paneMatrix(S, i, j, yc, h, off) {
    off = off === undefined ? 0.12 : off;
    const a = S[i], b = S[j];
    const mx = (a.p.x + b.p.x) / 2, mz = (a.p.y + b.p.y) / 2;
    const len = Math.hypot(b.p.x - a.p.x, b.p.y - a.p.y) + 0.08;
    const nx = (a.n.x + b.n.x) / 2, nz = (a.n.y + b.n.y) / 2;
    const tx = b.p.x - a.p.x, tz = b.p.y - a.p.y;
    const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.atan2(-tz, tx));
    return new THREE.Matrix4().compose(new THREE.Vector3(mx + nx * off, yc, mz + nz * off), q, new THREE.Vector3(len, h, 1));
  }
  // A window run: glass segments, an even green tint over each segment, and a soft halo on straight walls.
  function makeRun(S, run, yc, h, lit, upper) {
    const mats = [], tints = [];
    for (let k = 0; k < run.length - 1; k++) {
      mats.push(paneMatrix(S, run[k], run[k + 1], yc, h));
      tints.push(paneMatrix(S, run[k], run[k + 1], yc, h + 0.2, 0.34));
    }
    const first = S[run[0]].t, lastT = S[run[run.length - 1]].t;
    let glow = null;
    if (first.dot(lastT) > 0.995) {
      const a = S[run[0]].p, b = S[run[run.length - 1]].p, m = S[run[Math.floor(run.length / 2)]];
      glow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), glowMat);
      glow.scale.set(Math.hypot(b.x - a.x, b.y - a.y) + 4, h + 4, 1);
      glow.position.set((a.x + b.x) / 2 + m.n.x * 0.3, yc, (a.y + b.y) / 2 + m.n.y * 0.3);
      glow.rotation.y = Math.atan2(m.n.x, m.n.y);
      building.add(glow);
    }
    const r = { mats, tints, lit, glow, upper };
    runs.push(r);
    return r;
  }
  function refreshPanes() {
    let u = 0, l = 0, t = 0;
    runs.forEach((r) => {
      r.mats.forEach((mx) => { if (r.lit) paneLit.setMatrixAt(l++, mx); else paneUnlit.setMatrixAt(u++, mx); });
      if (r.lit) r.tints.forEach((mx) => tintMesh.setMatrixAt(t++, mx));
      if (r.glow) r.glow.visible = r.lit;
    });
    paneUnlit.count = u; paneLit.count = l; tintMesh.count = t;
    paneUnlit.instanceMatrix.needsUpdate = true; paneLit.instanceMatrix.needsUpdate = true; tintMesh.instanceMatrix.needsUpdate = true;
  }

  function buildBuilding(n) {
    if (building) {
      world.remove(building);
      building.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
    }
    building = new THREE.Group();
    runs = [];
    const rand = rng(7 + n);
    potPick = rng(41 + n);

    // contact shadow
    const sh = flatShape(lShape(1.8), shadowMat, TOP + 0.04);
    sh.position.x = 1; sh.position.z = 1;
    building.add(sh);

    // Ground floor: recessed shop front, thin columns, a canopy, and the entrance
    building.add(extrude(lShape(-3), G, M.white, TOP));
    const S0 = samples(-3);
    windowRuns(S0, rand, 7, 13, 2, 4, nearDoor).forEach((run) => makeRun(S0, run, TOP + 4.6, 7, rand() < 0.45, false));
    const SC = samples(-0.9);
    for (let i = 0; i < SC.length; i += 9) {
      const s = SC[i];
      if (s.blocked || nearDoor(s)) continue;
      const col = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, G, 10), M.white);
      col.position.set(s.p.x, TOP + G / 2, s.p.y);
      building.add(col);
    }
    building.add(extrude(lShape(0.7), 1.2, M.white, TOP + G, true));
    // entrance: lit door, small canopy, step
    building.add(box(4.6, 8.4, 0.3, M.glass, DOOR.x, TOP + 4.2, DOOR.z + 0.15));
    const dg = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), glowMat);
    dg.scale.set(11, 13, 1); dg.position.set(DOOR.x, TOP + 4.6, DOOR.z + 0.4);
    building.add(dg);
    building.add(box(7, 0.6, 4.2, M.white, DOOR.x, TOP + 9.2, DOOR.z + 2.1));
    building.add(box(7, 0.5, 2.4, M.white, DOOR.x, TOP + 0.25, DOOR.z + 1.2));

    // Upper floors
    const SU = samples(-1.2);
    const base = TOP + G + 1;
    for (let i = 0; i < n; i++) {
      const yb = base + i * FLOOR;
      building.add(extrude(lShape(-1.2), FLOOR, M.white, yb));
      if (i < n - 1) building.add(extrude(lShape(0.4), 1, M.white, yb + FLOOR - 0.5, true));
      // curved corner balcony
      building.add(extrude(sector(R - 1.6, R + 3.4), 1, M.white, yb - 0.5, true));
      building.add(extrude(sector(R + 2.8, R + 3.4), 3, M.white, yb + 0.45, true));
      // small straight balconies, stacked like Tel Aviv
      building.add(box(3, 0.9, 8, M.white, 25 - 1.2 + 1.5, yb, -14));
      building.add(box(0.4, 3, 8, M.white, 25 - 1.2 + 2.8, yb + 1.95, -14));
      building.add(box(7, 0.9, 3, M.white, -14, yb, 30 - 1.2 + 1.5));
      building.add(box(7, 3, 0.4, M.white, -14, yb + 1.95, 30 - 1.2 + 2.8));
      // windows
      windowRuns(SU, rand, 4, 10, 3, 7).forEach((run) => makeRun(SU, run, yb + 4.6, 4.8, rand() < 0.2, true));
      // potted plants on this floor's balconies
      [-75, -45, -15].forEach((deg) => {
        const a = deg * Math.PI / 180, rr0 = R + 1.7;
        pot(CX + rr0 * Math.cos(a), yb + 0.45, CZ - rr0 * Math.sin(a), i * 3 + deg);
      });
      pot(25 - 1.2 + 1.6, yb + 0.45, -16.6, i + 11);
      pot(25 - 1.2 + 1.6, yb + 0.45, -11.4, i + 17);
      pot(-16.4, yb + 0.45, 30 - 1.2 + 1.6, i + 23);
      pot(-11.6, yb + 0.45, 30 - 1.2 + 1.6, i + 29);
    }
    // Roof: slab, inset, small stair room
    const yT = base + n * FLOOR;
    building.add(extrude(lShape(0.5), 1.4, M.white, yT - 0.3, true));
    building.add(flatShape(lShape(-2.2), roofInset, yT + 1.15));
    building.add(box(9, 4, 7, M.white, -13, yT + 3, 14));

    // Glass panes as two instanced meshes (unlit glass, lit green)
    const total = runs.reduce((a, r) => a + r.mats.length, 0);
    const paneGeo = new THREE.BoxGeometry(1, 1, 0.3);
    paneUnlit = new THREE.InstancedMesh(paneGeo, M.glass, total);
    paneLit = new THREE.InstancedMesh(paneGeo, M.glass, total);
    tintMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), tintMat, total);
    paneUnlit.frustumCulled = false; paneLit.frustumCulled = false; tintMesh.frustumCulled = false;
    building.add(paneUnlit); building.add(paneLit); building.add(tintMesh);
    refreshPanes();

    world.add(building);
    frame(n);
  }

  // Puffy cartoon clouds drifting slowly across above the building (they don't turn with the scene)
  const cloudMat = new THREE.MeshBasicMaterial({ color: PAL.white[0] });
  function makeCloud(k) {
    const g = new THREE.Group();
    [[0, 0, 0, 3.2], [3.4, -0.6, 0.3, 2.4], [-3.2, -0.7, -0.2, 2.3], [1.2, 1.7, -0.4, 2.1]].forEach(([x, y, z, r]) => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), cloudMat);
      m.position.set(x, y, z); m.scale.set(1, 0.8, 1);
      g.add(m); outline(m, inkCloud, 1.07);
    });
    g.scale.setScalar(k);
    scene.add(g);
    return g;
  }
  const clouds = [
    { g: makeCloud(1.25), x: -24, z: -12, speed: 2.0, yo: 0, ph: 0 },
    { g: makeCloud(0.85), x: 46, z: 8, speed: 1.4, yo: -7, ph: 2 }
  ];
  function updateClouds(dt, now) {
    const base = TOP + G + 1 + floors * FLOOR + 15;
    clouds.forEach((c) => {
      c.x += c.speed * dt;
      if (c.x > 82) c.x = -82;
      c.g.position.set(c.x, base + c.yo + Math.sin(now / 1700 + c.ph) * 0.6, c.z);
    });
  }

  // Tiny pictogram people: flat sprites that always face the viewer
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath(); g.fill();
  }
  function figureTexture(withPet) {
    const c = document.createElement('canvas');
    c.width = withPet ? 112 : 48; c.height = 96;
    const g = c.getContext('2d');
    g.fillStyle = '#232523';
    g.beginPath(); g.arc(24, 13, 11.5, 0, Math.PI * 2); g.fill();
    rr(g, 6, 28, 36, 30, 10);
    rr(g, 10.5, 52, 11, 44, 5.5);
    rr(g, 26.5, 52, 11, 44, 5.5);
    if (withPet) {
      g.strokeStyle = '#4B4E4B'; g.lineWidth = 2.2;
      g.beginPath(); g.moveTo(41, 46); g.quadraticCurveTo(70, 70, 96, 62); g.stroke();
      rr(g, 66, 68, 34, 13, 6.5);
      g.beginPath(); g.arc(101, 64, 8, 0, Math.PI * 2); g.fill();
      rr(g, 69, 76, 5, 20, 2.5); rr(g, 91, 76, 5, 20, 2.5);
      g.lineWidth = 3; g.strokeStyle = '#232523';
      g.beginPath(); g.moveTo(67, 72); g.lineTo(60, 63); g.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    return { tex, aspect: c.width / c.height, feetX: 24 / c.width };
  }
  const texPerson = figureTexture(false), texPet = figureTexture(true);
  const E = HALF - 1.5;
  const walkers = [
    { a: [-E, 39.6], b: [E, 39.6], speed: 5.0, t: 0.1, pet: false, s: 1 },
    { a: [E, 36], b: [-E, 36], speed: 3.6, t: 0.55, pet: true, s: 1 },
    { a: [-31, E], b: [-31, -E], speed: 4.6, t: 0.3, pet: false, s: 1 },
    { a: [39, -E], b: [39, E], speed: 5.6, t: 0.75, pet: false, s: 0.78 },
    { a: [-E, -38], b: [E, -38], speed: 4.0, t: 0.45, pet: false, s: 1 },
    { a: [DOOR.x, DOOR.z + 1.5], b: [DOOR.x - 4, E], speed: 2.4, t: 0.0, pet: false, s: 1 }
  ].map((w) => {
    const T = w.pet ? texPet : texPerson;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: T.tex, transparent: true, depthWrite: false }));
    const h = 4.6 * w.s;
    sp.scale.set(h * T.aspect, h, 1);
    sp.center.set(T.feetX, 0);
    world.add(sp);
    w.sp = sp;
    w.len = Math.hypot(w.b[0] - w.a[0], w.b[1] - w.a[1]);
    return w;
  });
  function updateWalkers(dt) {
    walkers.forEach((w) => {
      w.t = (w.t + dt * w.speed / w.len) % 1;
      const x = w.a[0] + (w.b[0] - w.a[0]) * w.t, z = w.a[1] + (w.b[1] - w.a[1]) * w.t;
      w.sp.position.set(x, TOP + Math.abs(Math.sin(w.t * w.len * 0.9)) * 0.7, z);
      w.sp.material.opacity = Math.min(1, Math.min(w.t, 1 - w.t) / 0.08);
    });
  }

  // Camera: fixed flat (orthographic) view from 30 degrees up. Only the world turns.
  const EL = Math.PI / 6;
  let floors = 3;
  function frame(n) {
    const w = host.clientWidth || 358, h = host.clientHeight || 394;
    renderer.setSize(w, h, false);
    const aspect = w / h;
    const Htot = G + 1 + n * FLOOR + 1.2 + 5;
    const vmin = -34, vmax = Math.cos(EL) * (Htot + TOP) + 21;
    const vs = Math.max(130 / aspect, vmax - vmin + 10);
    camera.left = -vs * aspect / 2; camera.right = vs * aspect / 2;
    camera.top = vs / 2; camera.bottom = -vs / 2;
    const target = new THREE.Vector3(0, ((vmin + vmax) / 2) / Math.cos(EL), 0);
    camera.position.set(0, target.y + Math.sin(EL) * 200, Math.cos(EL) * 200);
    camera.lookAt(target);
    camera.updateProjectionMatrix();
  }

  // Controls
  let period = 60;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let paused = reduce;
  world.rotation.y = 0.55;
  const playBtn = document.getElementById('play');
  const syncPlay = () => { playBtn.textContent = paused ? 'Play' : 'Pause'; };
  syncPlay();
  playBtn.addEventListener('click', () => { paused = !paused; syncPlay(); });
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
    period = Number(b.dataset.sec);
    document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
  const out = document.getElementById('floorsOut');
  const setFloors = (n) => { floors = Math.max(1, Math.min(8, n)); out.textContent = floors; buildBuilding(floors); };
  document.getElementById('floorsDown').addEventListener('click', () => setFloors(floors - 1));
  document.getElementById('floorsUp').addEventListener('click', () => setFloors(floors + 1));

  if (window.ResizeObserver) new ResizeObserver(() => frame(floors)).observe(host);
  else window.addEventListener('resize', () => frame(floors));

  buildBuilding(floors);
  updateWalkers(0);
  updateClouds(0, performance.now());
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) {
      world.rotation.y += (Math.PI * 2) * dt / period;
      updateWalkers(dt);
      updateClouds(dt, now);
    }
    LIGHT.copy(LIGHT_BASE).applyAxisAngle(Y_AXIS, world.rotation.y);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
